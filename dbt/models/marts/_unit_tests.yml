version: 2

# Unit tests check the calculations on a few hand-made rows, independently of the data loaded.
# Run with the rest of the project by `dbt build`, or alone with `dbt test --select test_type:unit`.
# Results are compared as text, so expected numbers carry the model's decimals ("1005.00").

unit_tests:
  - name: fees_raise_a_buy_and_reduce_a_sale
    model: fct_transactions
    description: >
      Money put in includes fees; money received from a sale has the fees taken off. Indexa
      amounts already include costs and pass through unchanged.
    given:
      - input: ref('stg_indexa__transactions')
        rows:
          - {account_id: IDX1, transaction_id: t1, trade_date: 2026-01-05, isin: FUND, transaction_type: buy, quantity: 5, price: 100, amount: 500}
      - input: ref('stg_airtable__transactions')
        rows:
          - {account_id: Broker, transaction_id: r1, trade_date: 2026-01-05, isin: ETF, transaction_type: buy, quantity: 10, price: 100, fees: 5}
          - {account_id: Broker, transaction_id: r2, trade_date: 2026-02-05, isin: ETF, transaction_type: sell, quantity: 4, price: 120, fees: 3}
    expect:
      rows:
        - {transaction_id: t1, source: indexa, amount: 500, signed_quantity: 5, signed_amount: 500}
        - {transaction_id: r1, source: airtable, amount: "1005.00", signed_quantity: 10, signed_amount: "1005.00"}
        - {transaction_id: r2, source: airtable, amount: "477.00", signed_quantity: -4, signed_amount: "-477.00"}

  - name: position_is_valued_at_cost_until_a_price_exists
    model: fct_positions_daily
    description: >
      Before the first price the position is worth what it cost, flagged as estimated; from then
      on it is units times price. A second buy adds to units and money invested.
    overrides:
      macros:
        as_of_date: "'2026-01-03'::date"
    given:
      - input: ref('fct_transactions')
        rows:
          - {account_id: A, isin: ETF, trade_date: 2026-01-01, signed_quantity: 10, signed_amount: 1000}
          - {account_id: A, isin: ETF, trade_date: 2026-01-03, signed_quantity: 5, signed_amount: 600}
      - input: ref('int_prices_daily')
        rows:
          - {isin: ETF, date_day: 2026-01-02, close_price: 110}
          - {isin: ETF, date_day: 2026-01-03, close_price: 120}
    expect:
      rows:
        - {date_day: 2026-01-01, quantity: 10, net_flow: 1000, net_invested: 1000, is_price_estimated: true, market_value: "1000.00"}
        - {date_day: 2026-01-02, quantity: 10, net_flow: 0, net_invested: 1000, is_price_estimated: false, market_value: "1100.00"}
        - {date_day: 2026-01-03, quantity: 15, net_flow: 600, net_invested: 1600, is_price_estimated: false, market_value: "1800.00"}

  - name: contributions_do_not_count_as_performance
    model: portfolio_performance
    description: >
      A day when money is added but prices do not move has a 0% return, even though the value
      goes up. Total gain is value minus money invested.
    given:
      - input: ref('fct_positions_daily')
        rows:
          - {date_day: 2026-01-01, market_value: 1000, net_invested: 1000, net_flow: 1000}
          - {date_day: 2026-01-02, market_value: 1100, net_invested: 1000, net_flow: 0}
          - {date_day: 2026-01-03, market_value: 1600, net_invested: 1500, net_flow: 500}
          - {date_day: 2026-01-04, market_value: 1440, net_invested: 1500, net_flow: 0}
    expect:
      rows:
        - {date_day: 2026-01-01, total_gain: 0, daily_return: "0.0000000000"}
        - {date_day: 2026-01-02, total_gain: 100, daily_return: "0.1000000000"}
        - {date_day: 2026-01-03, total_gain: 100, daily_return: "0.0000000000"}
        - {date_day: 2026-01-04, total_gain: -60, daily_return: "-0.1000000000"}

  - name: monthly_gain_leaves_out_money_added
    model: portfolio_monthly
    description: >
      A month's gain is the change in value minus the money added; the current month is not
      complete.
    overrides:
      macros:
        as_of_date: "'2026-02-28'::date"
    given:
      - input: ref('portfolio_performance')
        rows:
          - {date_day: 2026-01-30, market_value: 1000, net_flow: 1000, daily_return: 0}
          - {date_day: 2026-01-31, market_value: 1050, net_flow: 0, daily_return: 0.05}
          - {date_day: 2026-02-01, market_value: 1550, net_flow: 500, daily_return: 0}
          - {date_day: 2026-02-28, market_value: 1500, net_flow: 0, daily_return: -0.0322580645}
    expect:
      rows:
        - {month: 2026-01-01, month_end_value: 1050, money_added: 1000, gain: 50, is_complete: true}
        - {month: 2026-02-01, month_end_value: 1500, money_added: 500, gain: -50, is_complete: false}

  - name: highlights_find_best_worst_month_and_biggest_drop
    model: portfolio_highlights
    description: >
      Only complete months count; the biggest drop runs from the last high before the lowest
      point, and the portfolio is still below that high today.
    given:
      - input: ref('portfolio_monthly')
        rows:
          - {month: 2026-01-01, gain: 50, return_pct: 0.05, is_complete: true}
          - {month: 2026-02-01, gain: -30, return_pct: -0.03, is_complete: true}
          - {month: 2026-03-01, gain: 20, return_pct: 0.02, is_complete: true}
          - {month: 2026-04-01, gain: 100, return_pct: 0.10, is_complete: false}
      - input: ref('portfolio_performance')
        rows:
          - {date_day: 2026-01-01, cumulative_twr: 0}
          - {date_day: 2026-02-01, cumulative_twr: 0.2}
          - {date_day: 2026-03-01, cumulative_twr: -0.1}
          - {date_day: 2026-04-01, cumulative_twr: 0.08}
    expect:
      rows:
        - best_month: 2026-01-01
          best_month_return: 0.05
          worst_month: 2026-02-01
          worst_month_return: -0.03
          months_counted: 3
          months_with_gain: 2
          share_of_months_with_gain: "0.6667"
          biggest_drop_pct: "-0.2500000000"
          biggest_drop_from: 2026-02-01
          biggest_drop_to: 2026-03-01
          below_high_pct: "-0.1000000000"

  - name: airtable_rows_deleted_in_airtable_drop_out
    model: stg_airtable__plan
    description: >
      Raw tables keep every version, but only records in the table's latest id list count, so
      a row deleted in Airtable disappears on the next run.
    given:
      - input: source('raw', 'airtable_plan')
        rows:
          - {id: 1, entity: Plan, record_key: recOLD, loaded_at: "2026-01-01 05:00:00", payload: '{"fields": {"goal": "Deleted plan"}}'}
          - {id: 2, entity: Plan, record_key: __ids__, loaded_at: "2026-01-01 05:00:00", payload: '{"ids": ["recOLD"]}'}
          - {id: 3, entity: Plan, record_key: recNEW, loaded_at: "2026-01-02 05:00:00", payload: '{"fields": {"goal": "Current plan", "horizon_year": 2050}}'}
          - {id: 4, entity: Plan, record_key: __ids__, loaded_at: "2026-01-02 05:00:00", payload: '{"ids": ["recNEW"]}'}
    expect:
      rows:
        - {plan_id: recNEW, goal: Current plan, horizon_year: 2050}

  - name: limits_are_checked_against_todays_shares
    model: target_checks
    description: >
      Ranges, a group of regions, Any limits expanded per value with an exemption for a value
      that has its own limit, each_instrument (also narrowed to one type), a floor-only limit,
      and a share only slightly above its maximum. Portfolio worth 10,000.
    given:
      - input: ref('asset_allocation')
        rows:
          - {isin: A, instrument_name: World ETF, asset_class: Equity, region: Global, instrument_type: ETF, liquidity: Immediate, platform: Broker, market_value: 6000}
          - {isin: B, instrument_name: EM ETF, asset_class: Equity, region: Emerging markets, instrument_type: ETF, liquidity: Immediate, platform: Broker, market_value: 1500}
          - {isin: C, instrument_name: Bond Fund, asset_class: Fixed income, region: Europe, instrument_type: Index fund, liquidity: Days, platform: Indexa Capital, market_value: 2500}
      - input: ref('dim_instrument')
        rows:
          - {isin: A, instrument_name: World ETF}
          - {isin: B, instrument_name: EM ETF}
          - {isin: C, instrument_name: Bond Fund}
      # Written as SQL: dbt cannot build fixture rows for an array column on Postgres.
      - input: ref('stg_airtable__targets')
        format: sql
        rows: |
          select 't1'::text as target_id, 'asset_class'::text as dimension, 1 as dimensions_filled, array['Equity']::text[] as target_values, null::text as scope_dimension, null::text[] as scope_values, 0.55::numeric as min_weight, 0.60::numeric as target_weight, 0.65::numeric as max_weight, null::text as note
          union all select 't2'::text as target_id, 'asset_class'::text as dimension, 1 as dimensions_filled, array['Fixed income']::text[] as target_values, null::text as scope_dimension, null::text[] as scope_values, 0.25::numeric as min_weight, null::numeric as target_weight, 0.35::numeric as max_weight, null::text as note
          union all select 't3'::text as target_id, 'region'::text as dimension, 1 as dimensions_filled, array['Emerging markets', 'China']::text[] as target_values, null::text as scope_dimension, null::text[] as scope_values, null::numeric as min_weight, null::numeric as target_weight, 0.10::numeric as max_weight, null::text as note
          union all select 't4'::text as target_id, 'region'::text as dimension, 1 as dimensions_filled, array['Any']::text[] as target_values, null::text as scope_dimension, null::text[] as scope_values, null::numeric as min_weight, null::numeric as target_weight, 0.40::numeric as max_weight, null::text as note
          union all select 't5'::text as target_id, 'region'::text as dimension, 1 as dimensions_filled, array['Global']::text[] as target_values, null::text as scope_dimension, null::text[] as scope_values, null::numeric as min_weight, null::numeric as target_weight, null::numeric as max_weight, null::text as note
          union all select 't6'::text as target_id, 'instrument'::text as dimension, 1 as dimensions_filled, array['Any']::text[] as target_values, null::text as scope_dimension, null::text[] as scope_values, null::numeric as min_weight, null::numeric as target_weight, 0.50::numeric as max_weight, null::text as note
          union all select 't7'::text as target_id, 'liquidity'::text as dimension, 1 as dimensions_filled, array['Immediate', 'Days']::text[] as target_values, null::text as scope_dimension, null::text[] as scope_values, 0.20::numeric as min_weight, null::numeric as target_weight, null::numeric as max_weight, null::text as note
          union all select 't8'::text as target_id, 'platform'::text as dimension, 1 as dimensions_filled, array['Any']::text[] as target_values, null::text as scope_dimension, null::text[] as scope_values, null::numeric as min_weight, null::numeric as target_weight, 0.70::numeric as max_weight, null::text as note
          union all select 't9'::text as target_id, 'region'::text as dimension, 2 as dimensions_filled, array['Europe']::text[] as target_values, null::text as scope_dimension, null::text[] as scope_values, null::numeric as min_weight, null::numeric as target_weight, 0.01::numeric as max_weight, null::text as note
          union all select 't10'::text as target_id, 'instrument_type'::text as dimension, 1 as dimensions_filled, array['Index fund']::text[] as target_values, null::text as scope_dimension, null::text[] as scope_values, null::numeric as min_weight, null::numeric as target_weight, 0.24::numeric as max_weight, null::text as note
          union all select 't11'::text as target_id, 'instrument'::text as dimension, 1 as dimensions_filled, array['Any']::text[] as target_values, 'instrument_type'::text as scope_dimension, array['Index fund']::text[] as scope_values, null::numeric as min_weight, null::numeric as target_weight, 0.20::numeric as max_weight, null::text as note
    expect:
      rows:
        - {target_id: t1, label: Equity, status: Above maximum, amount_to_range: "-1000.00", amount_to_target: "-1500.00"}
        - {target_id: t2, label: Fixed income, status: Within range, amount_to_range: "0.00", amount_to_target: "500.00"}
        - {target_id: t3, label: "Emerging markets, China", status: Above maximum, amount_to_range: "-500.00", amount_to_target: null}
        - {target_id: t4, label: Emerging markets, status: Within range, amount_to_range: "0.00", amount_to_target: null}
        - {target_id: t4, label: Europe, status: Within range, amount_to_range: "0.00", amount_to_target: null}
        - {target_id: t5, label: Global, status: Within range, amount_to_range: "0.00", amount_to_target: null}
        - {target_id: t6, label: World ETF, status: Above maximum, amount_to_range: "-1000.00", amount_to_target: null}
        - {target_id: t6, label: EM ETF, status: Within range, amount_to_range: "0.00", amount_to_target: null}
        - {target_id: t6, label: Bond Fund, status: Within range, amount_to_range: "0.00", amount_to_target: null}
        - {target_id: t7, label: "Immediate, Days", status: Within range, amount_to_range: "0.00", amount_to_target: null}
        - {target_id: t8, label: Broker, status: Above maximum, amount_to_range: "-500.00", amount_to_target: null}
        - {target_id: t8, label: Indexa Capital, status: Within range, amount_to_range: "0.00", amount_to_target: null}
        - {target_id: t10, label: Index fund, status: Slightly above maximum, amount_to_range: "-100.00", amount_to_target: null}
        - {target_id: t11, label: Bond Fund, status: Above maximum, amount_to_range: "-500.00", amount_to_target: null}
