version: 2

# Gold models are what the app, the assistant and ad-hoc queries read, so their shape is a
# contract: every column has a declared type, and a build that would change a type or drop a
# column fails before the table is replaced. Key columns are also enforced as primary keys.

models:
  - name: dim_instrument
    description: >
      One row per instrument: a fund, ETF, share or the benchmark. Described by hand in Airtable;
      instruments seen in Indexa but not yet described there still appear, as Unclassified.
    config:
      contract: {enforced: true}
    columns:
      - name: isin
        description: International identifier of the instrument, or a made-up code for unlisted ones.
        data_type: text
        constraints: [{type: primary_key}]
        data_tests: [unique, not_null]
      - name: instrument_name
        description: Display name.
        data_type: text
      - name: eodhd_symbol
        description: Symbol used to fetch daily prices from EODHD. Empty when prices come from Indexa.
        data_type: text
      - name: asset_class
        description: What the instrument invests in (Equity, Fixed income, Money market...).
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: &asset_classes
                  - Equity
                  - Fixed income
                  - Money market
                  - Mixed
                  - Real estate
                  - Commodities
                  - Crypto
                  - Unclassified
              config: {severity: warn}
      - name: region
        description: Where the instrument's holdings are, not where it is listed.
        data_type: text
        data_tests: [not_null]
      - name: instrument_type
        description: The wrapper it is held through (ETF, Index fund, Pension plan...).
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: &instrument_types
                  - ETF
                  - ETC
                  - Index fund
                  - Pension plan
                  - Share
                  - Private shares
                  - Crypto
                  - Unclassified
              config: {severity: warn}
      - name: liquidity
        description: How quickly it can be turned into cash.
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: &liquidity_levels [Immediate, Days, Restricted, Illiquid, Unclassified]
              config: {severity: warn}
      - name: currency
        description: Currency of the listing traded. Only EUR is supported for now.
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [EUR]
              config: {severity: warn}
      - name: is_benchmark
        description: True for the instrument the portfolio is compared against. Never counted as a holding.
        data_type: boolean
        data_tests: [not_null]
      - name: yearly_fee_pct
        description: The fund's yearly fee (TER) as a fraction, 0.002 for 0.20%. Empty when not recorded.
        data_type: numeric

  - name: fct_transactions
    description: One row per buy or sell, from Indexa and from Airtable, in one shape.
    config:
      contract: {enforced: true}
    columns:
      - name: transaction_key
        description: Unique key, built from source, account and transaction id.
        data_type: text
        constraints: [{type: primary_key}]
        data_tests: [unique, not_null]
      - name: source
        description: Where the transaction came from.
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [indexa, airtable]
      - name: account_id
        description: Indexa account number, or the platform name given in Airtable.
        data_type: text
        data_tests: [not_null]
      - name: transaction_id
        description: Id of the transaction in its source.
        data_type: text
        data_tests: [not_null]
      - name: trade_date
        description: Day the trade happened.
        data_type: date
        data_tests: [not_null]
      - name: isin
        description: Instrument traded.
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_instrument')
                field: isin
              config:
                severity: warn
      - name: transaction_type
        description: buy or sell.
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["buy", "sell"]
      - name: quantity
        description: Units traded, always positive.
        data_type: numeric
        data_tests: [not_null]
      - name: price
        description: Price per unit in EUR.
        data_type: numeric
      - name: amount
        description: >
          Money that changed hands in EUR, always positive. Fees are added to a buy and taken off
          a sale.
        data_type: numeric
        data_tests: [not_null]
      - name: signed_quantity
        description: Quantity, positive for a buy and negative for a sale.
        data_type: numeric
        data_tests: [not_null]
      - name: signed_amount
        description: Amount, positive for money put in and negative for money taken out.
        data_type: numeric
        data_tests: [not_null]

  - name: fct_positions_daily
    description: >
      Units held, money invested and market value per account, instrument and day, from the
      first trade until today. Positions are rebuilt from transactions.
    config:
      contract: {enforced: true}
    columns:
      - name: position_key
        description: Unique key, built from account, instrument and day.
        data_type: text
        constraints: [{type: primary_key}]
        data_tests: [unique, not_null]
      - name: account_id
        description: Account holding the position.
        data_type: text
        data_tests: [not_null]
      - name: isin
        description: Instrument held.
        data_type: text
        data_tests: [not_null]
      - name: date_day
        description: Calendar day.
        data_type: date
        data_tests: [not_null]
      - name: quantity
        description: Units held at the end of the day.
        data_type: numeric
        data_tests: [not_null]
      - name: net_flow
        description: Money put in (positive) or taken out (negative) that day.
        data_type: numeric
        data_tests: [not_null]
      - name: net_invested
        description: Money put in minus money taken out, up to that day.
        data_type: numeric
        data_tests: [not_null]
      - name: close_price
        description: Price used for the day. Empty before the price history starts.
        data_type: numeric
      - name: is_price_estimated
        description: True when there was no price yet and the position is valued at what it cost.
        data_type: boolean
        data_tests: [not_null]
      - name: market_value
        description: Units held times the day's price, in EUR.
        data_type: numeric
        data_tests: [not_null]

  - name: portfolio_performance
    description: Whole-portfolio value, money invested, gain and time-weighted return per day.
    config:
      contract: {enforced: true}
    columns:
      - name: date_day
        description: Calendar day.
        data_type: date
        constraints: [{type: primary_key}]
        data_tests: [unique, not_null]
      - name: market_value
        description: Value of everything held that day, in EUR.
        data_type: numeric
        data_tests: [not_null]
      - name: net_invested
        description: Money put in minus money taken out, up to that day.
        data_type: numeric
        data_tests: [not_null]
      - name: net_flow
        description: Money put in or taken out that day.
        data_type: numeric
        data_tests: [not_null]
      - name: total_gain
        description: Market value minus money invested.
        data_type: numeric
        data_tests: [not_null]
      - name: daily_return
        description: >
          The day's return, leaving out money put in or taken out that day, so a contribution
          does not count as performance. 0.01 means 1%.
        data_type: numeric
        data_tests: [not_null]
      - name: cumulative_twr
        description: >
          Time-weighted return since the first day: the daily returns chained together. It shows
          how the investments did, whatever the timing of contributions.
        data_type: numeric
        data_tests: [not_null]

  - name: investment_returns
    description: Where each holding stands today. Closed positions stay in, with their realised gain.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [account_id, isin]
    columns:
      - name: account_id
        description: Account holding the position.
        data_type: text
        data_tests: [not_null]
      - name: platform
        description: Indexa Capital for every Indexa account; otherwise the platform named in Airtable.
        data_type: text
        data_tests: [not_null]
      - name: isin
        description: Instrument held.
        data_type: text
        data_tests: [not_null]
      - name: instrument_name
        description: Display name.
        data_type: text
      - name: asset_class
        description: From dim_instrument.
        data_type: text
      - name: region
        description: From dim_instrument.
        data_type: text
      - name: instrument_type
        description: From dim_instrument.
        data_type: text
      - name: liquidity
        description: From dim_instrument.
        data_type: text
      - name: first_trade_date
        description: Day of the first trade in this account and instrument.
        data_type: date
        data_tests: [not_null]
      - name: quantity
        description: Units held today. Zero for a closed position.
        data_type: numeric
        data_tests: [not_null]
      - name: net_invested
        description: Money put in minus money taken out.
        data_type: numeric
        data_tests: [not_null]
      - name: market_value
        description: Value today, in EUR.
        data_type: numeric
        data_tests: [not_null]
      - name: total_gain
        description: Market value minus money invested.
        data_type: numeric
        data_tests: [not_null]
      - name: return_pct
        description: Total gain as a share of everything ever bought. 0.10 means 10%.
        data_type: numeric
      - name: yearly_fee
        description: What the fund charges per year at today's value, in EUR. Empty when its fee is not recorded.
        data_type: numeric
      - name: is_price_estimated
        description: True when there is no price yet and the value is what it cost.
        data_type: boolean
        data_tests: [not_null]

  - name: asset_allocation
    description: >
      Current holdings per instrument and platform with their share of the portfolio. The app
      groups it by asset class, region, type, liquidity or platform.
    config:
      contract: {enforced: true}
    columns:
      - name: allocation_key
        description: Unique key, built from instrument and platform.
        data_type: text
        constraints: [{type: primary_key}]
        data_tests: [unique, not_null]
      - name: isin
        description: Instrument held.
        data_type: text
        data_tests: [not_null]
      - name: platform
        description: Where it is held.
        data_type: text
        data_tests: [not_null]
      - name: instrument_name
        description: Display name, or the ISIN when there is none.
        data_type: text
        data_tests: [not_null]
      - name: asset_class
        description: From dim_instrument; Unclassified when missing.
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: *asset_classes
              config: {severity: warn}
      - name: region
        description: From dim_instrument; Unclassified when missing.
        data_type: text
        data_tests: [not_null]
      - name: instrument_type
        description: From dim_instrument; Unclassified when missing.
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: *instrument_types
              config: {severity: warn}
      - name: liquidity
        description: From dim_instrument; Unclassified when missing.
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: *liquidity_levels
              config: {severity: warn}
      - name: market_value
        description: Value today, in EUR.
        data_type: numeric
        data_tests: [not_null]
      - name: weight
        description: Share of the whole portfolio's value. All rows add up to 1.
        data_type: numeric
        data_tests: [not_null]

  - name: benchmark_comparison
    description: >
      Portfolio return next to the benchmark's return per day, both starting from zero on the
      first day they have in common.
    config:
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [benchmark_isin, date_day]
    columns:
      - name: benchmark_isin
        description: The benchmark instrument.
        data_type: text
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_instrument')
                field: isin
      - name: benchmark_name
        description: Its display name.
        data_type: text
      - name: date_day
        description: Calendar day.
        data_type: date
        data_tests: [not_null]
      - name: portfolio_return
        description: Portfolio time-weighted return since the first common day.
        data_type: numeric
        data_tests: [not_null]
      - name: benchmark_return
        description: Benchmark price return since the first common day.
        data_type: numeric
        data_tests: [not_null]
      - name: excess_return
        description: Portfolio return minus benchmark return. Positive means ahead of the benchmark.
        data_type: numeric
        data_tests: [not_null]

  - name: portfolio_monthly
    description: >
      The portfolio month by month. The current month is included and marked as not complete.
    config:
      contract: {enforced: true}
    columns:
      - name: month
        description: First day of the month.
        data_type: date
        constraints: [{type: primary_key}]
        data_tests: [unique, not_null]
      - name: last_day
        description: Last day with data in the month (today for the current month).
        data_type: date
        data_tests: [not_null]
      - name: month_end_value
        description: Value of everything held on the month's last day.
        data_type: numeric
        data_tests: [not_null]
      - name: money_added
        description: Money put in minus money taken out during the month.
        data_type: numeric
        data_tests: [not_null]
      - name: gain
        description: >
          What the investments gained or lost during the month, in EUR: the change in value
          minus the money added.
        data_type: numeric
        data_tests: [not_null]
      - name: return_pct
        description: The month's return, leaving out money added. 0.02 means 2%.
        data_type: numeric
        data_tests: [not_null]
      - name: is_complete
        description: False for the current month.
        data_type: boolean
        data_tests: [not_null]

  - name: portfolio_highlights
    description: >
      One row of simple facts about the ups and downs: best and worst complete month, how often a
      month ended with a gain, and the biggest drop from a previous high. Drops are measured on
      the time-weighted return, so adding or withdrawing money does not count as a rise or a fall.
    config:
      contract: {enforced: true}
    columns:
      - name: best_month
        description: Complete month with the highest return.
        data_type: date
      - name: best_month_return
        description: Its return.
        data_type: numeric
      - name: worst_month
        description: Complete month with the lowest return.
        data_type: date
      - name: worst_month_return
        description: Its return.
        data_type: numeric
      - name: months_counted
        description: Complete months with data.
        data_type: integer
        data_tests: [not_null]
      - name: months_with_gain
        description: Complete months in which the investments gained.
        data_type: integer
        data_tests: [not_null]
      - name: share_of_months_with_gain
        description: months_with_gain divided by months_counted.
        data_type: numeric
      - name: biggest_drop_pct
        description: >
          The largest fall from a previous high to a later low. -0.15 means the portfolio was at
          one point 15% below its earlier high.
        data_type: numeric
        data_tests: [not_null]
      - name: biggest_drop_from
        description: Day of the high before that fall.
        data_type: date
        data_tests: [not_null]
      - name: biggest_drop_to
        description: Day of the low.
        data_type: date
        data_tests: [not_null]
      - name: below_high_pct
        description: How far below its highest point the portfolio is today. 0 means at a high.
        data_type: numeric
        data_tests: [not_null]

  - name: investment_plan
    description: >
      The owner's plan in one row: goal, horizon and rules from Airtable, and the money actually
      added per month on average over the last 12 complete months. Empty without a plan.
    config:
      contract: {enforced: true}
    columns:
      - name: goal
        description: What the money is for.
        data_type: text
      - name: horizon_year
        description: The year the money is expected to be needed.
        data_type: integer
      - name: rules
        description: The owner's own investing rules, one per line.
        data_type: text
      - name: avg_money_added_12m
        description: Average money put in minus taken out per month, last 12 complete months.
        data_type: numeric

  - name: target_checks
    description: >
      The owner's limits checked against today's portfolio. One row per limit; a limit on Any
      value becomes one row per held value, except values with a limit of their own.
    config:
      contract: {enforced: true}
    columns:
      - name: check_key
        description: Unique key, from the Airtable row and the value it applies to.
        data_type: text
        constraints: [{type: primary_key}]
        data_tests: [unique, not_null]
      - name: target_id
        description: The Airtable targets row.
        data_type: text
        data_tests: [not_null]
      - name: dimension
        description: asset_class, region, instrument_type, liquidity, platform or instrument.
        data_type: text
        data_tests: [not_null]
      - name: applies_to_each
        description: True when this row comes from an Any limit (or each_instrument).
        data_type: boolean
        data_tests: [not_null]
      - name: label
        description: What the limit covers, e.g. "Emerging markets, China" or a fund's name.
        data_type: text
      - name: current_value
        description: Today's value of what the limit covers, in EUR.
        data_type: numeric
        data_tests: [not_null]
      - name: current_weight
        description: Today's share of the portfolio. 0.25 means 25%.
        data_type: numeric
      - name: min_weight
        description: Lowest accepted share. Empty means no minimum.
        data_type: numeric
      - name: target_weight
        description: Where the owner aims to be; the middle of the range when only min and max are set.
        data_type: numeric
      - name: max_weight
        description: Highest accepted share. Empty means no maximum.
        data_type: numeric
      - name: status
        description: >
          Below minimum, Above maximum, Within range, or Slightly below minimum / Slightly
          above maximum when outside by up to 2 points (or a fifth of the limit, if smaller),
          which needs no action.
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Below minimum
                  - Slightly below minimum
                  - Within range
                  - Slightly above maximum
                  - Above maximum
      - name: amount_to_range
        description: >
          EUR to add (positive) or reduce (negative) to get back to the nearest edge of the
          range, also when only slightly outside. 0 when within range.
        data_type: numeric
      - name: amount_to_target
        description: EUR to add (positive) or reduce (negative) to reach the target. Empty without a target.
        data_type: numeric
      - name: note
        description: Why the limit exists, in the owner's words.
        data_type: text
