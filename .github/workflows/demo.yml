name: Refresh demo

# Regenerates the fictional demo portfolio, valued at real EODHD closes, in the demo database.
# Runs on Sunday so its 8 EODHD calls never compete with the daily pipeline, which shares the key.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: demo # demo database credentials and the EODHD key, nothing personal
    env:
      APP_ENV: demo
      PGHOST: ${{ secrets.PGHOST }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGSSLMODE: require
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
      EODHD_HISTORY_DAYS: "365"
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dbt]"
      - run: python -m invest_intel.synthetic.generate --real-prices
      - run: dbt build
        working-directory: dbt
