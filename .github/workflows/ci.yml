name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs the whole pipeline on synthetic data against a throwaway PostgreSQL.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invest_intel
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: demo
      PGHOST: localhost
      PGDATABASE: invest_intel
      PGUSER: postgres
      PGPASSWORD: postgres
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dbt,semantic,insights,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m invest_intel.synthetic.generate
      - run: dbt build
        working-directory: dbt
      # The semantic layer: definitions are valid against the built tables, and a metric answers.
      - run: mf validate-configs
        working-directory: dbt
      - run: mf query --metrics portfolio_value,money_added,gain_pct --group-by metric_time__month --limit 3
        working-directory: dbt
